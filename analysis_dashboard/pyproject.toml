[project]
name = "analysis-dashboard"
version = "0.1.0"
description = "Decoupled log analysis agent with Neo4j graph mapping, trend analytics, and Streamlit UI."
requires-python = ">=3.14"
dependencies = [
   "eth-account>=0.13.7",
   "langchain>=1.3.4",
   "langchain-core>=1.4.0",
   "langchain-huggingface>=1.2.2",
   "langchain-openai>=1.2.2",
   "langgraph>=1.2.4",
   "langgraph-checkpoint-sqlite>=3.1.0",
   "lime>=0.2.0.1",
   "matplotlib>=3.10.9",
   "neo4j>=6.2.0",
   "nest-asyncio>=1.6.0",
   "numpy>=2.4.6",
   "psycopg2-binary>=2.9.12",
   "pydantic>=2.13.4",
   "python-dotenv>=1.2.2",
   "redis>=7.4.1",
   "scikit-learn>=1.9.0",
   "seaborn>=0.13.2",
   "sentence-transformers>=5.5.1",
   "shap>=0.52.0",
   "streamlit>=1.58.0",
   "supabase>=2.31.0",
   "web3>=7.16.0",
]
