[project]
name = "agent-client"
version = "0.1.0"
description = "LangChain agent client with FastMCP client, sampling handler, and AsyncSqliteStore vector log persistence."
requires-python = ">=3.14"
dependencies = [
   "fastmcp>=3.4.0",
   "langchain>=1.3.4",
   "langchain-core>=1.4.0",
   "langchain-huggingface>=1.2.2",
   "langchain-mcp-adapters>=0.2.2",
   "langchain-openai>=1.2.2",
   "langgraph>=1.2.4",
   "langgraph-checkpoint-sqlite>=3.1.0",
   "openai>=2.41.0",
   "python-dotenv>=1.2.2",
   "sentence-transformers>=5.5.1",
]
