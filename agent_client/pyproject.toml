[project]
name = "agent-client"
version = "0.1.0"
description = "LangChain agent client with FastMCP client, sampling handler, and AsyncSqliteStore vector log persistence."
requires-python = ">=3.14"
dependencies = [
   "asyncpg>=0.31.0",
   "fastmcp>=3.4.0",
   "langchain>=1.3.4",
   "langchain-core>=1.4.0",
   "langchain-huggingface>=1.2.2",
   "langchain-mcp-adapters>=0.2.2",
   "langchain-openai>=1.2.2",
   "langgraph>=1.2.4",
   "langgraph-checkpoint-sqlite>=3.1.0",
   "openai>=2.41.0",
   "psycopg2-binary>=2.9.12",
   "python-dotenv>=1.2.2",
   "redis>=7.4.1",
   "redisvl>=0.23.0",
   "sentence-transformers>=5.5.1",
   "supabase>=2.31.0",
   "tenacity>=9.1.4",
]
